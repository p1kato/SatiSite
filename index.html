<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 окошек</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cols: 6;
    --rows: 5;
    --gap: clamp(8px, 1.6vmin, 22px);
    --pad: clamp(14px, 3vmin, 40px);
    --tile: min(
      (100vw - 2 * var(--pad) - (var(--cols) - 1) * var(--gap)) / var(--cols),
      (100vh - 2 * var(--pad) - (var(--rows) - 1) * var(--gap)) / var(--rows)
    );
    --bg1: #5fc8f5;
    --bg2: #2f9fe0;
    --tile1: #1d4fb8;
    --tile2: #12358a;
    --edge: #3f7cf0;
    --accent: #b6f23a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Rubik", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,.18), transparent 45%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    display: grid;
    place-items: center;
  }

  /* ---------- Сетка ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--tile));
    grid-template-rows: repeat(var(--rows), var(--tile));
    gap: var(--gap);
    transition: transform .9s cubic-bezier(.22,1,.36,1);
    will-change: transform;
  }
  body.is-open .grid {
    transform: scale(.95);
  }

  .tile {
    position: relative;
    border: none;
    cursor: pointer;
    border-radius: calc(var(--tile) * .08);
    background: linear-gradient(145deg, var(--tile1), var(--tile2));
    box-shadow:
      inset 0 0 0 calc(var(--tile) * .035) var(--edge),
      inset 0 0 0 calc(var(--tile) * .06) var(--tile2),
      0 calc(var(--tile) * .05) 0 #0b2466,
      0 calc(var(--tile) * .09) calc(var(--tile) * .12) rgba(0,0,0,.25);
    color: #fff;
    font: 800 calc(var(--tile) * .36) / 1 "Rubik", sans-serif;
    text-shadow: 0 .06em 0 rgba(0,0,0,.35);
    display: grid;
    place-items: center;
    overflow: hidden;
    transition: transform .25s cubic-bezier(.3,1.6,.5,1), box-shadow .25s;
    animation: tileIn .6s cubic-bezier(.3,1.5,.5,1) backwards;
    animation-delay: calc(var(--i) * 25ms);
  }
  .tile::before, .tile::after {
    content: "";
    position: absolute;
    width: 14%;
    height: 14%;
    border: calc(var(--tile) * .02) solid rgba(255,255,255,.35);
    border-radius: 50%;
    border-right-color: transparent;
    border-bottom-color: transparent;
  }
  .tile::before { top: 9%; left: 9%; }
  .tile::after  { bottom: 9%; right: 9%; transform: rotate(180deg); }

  .tile:hover { transform: translateY(-4px) scale(1.04); }
  .tile:active { transform: translateY(2px) scale(.97); }

  .tile.hidden { visibility: hidden; }

  /* Открытое окошко — показывает картинку */
  .tile .thumb {
    position: absolute;
    inset: 7%;
    border-radius: calc(var(--tile) * .05);
    background: center / cover no-repeat;
    border: calc(var(--tile) * .03) solid var(--accent);
    opacity: 0;
    transform: scale(.6);
    transition: opacity .4s, transform .5s cubic-bezier(.3,1.6,.5,1);
  }
  .tile.opened .thumb { opacity: 1; transform: scale(1); }
  .tile .num { position: relative; z-index: 1; transition: all .4s; }
  .tile.opened .num {
    position: absolute;
    top: 5%;
    left: 6%;
    font-size: calc(var(--tile) * .16);
    background: var(--tile2);
    padding: .15em .35em;
    border-radius: .4em;
  }

  @keyframes tileIn {
    from { opacity: 0; transform: scale(.3) rotate(-8deg); }
  }

  /* ---------- Открытая карточка ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(10,30,90,.45), rgba(5,15,50,.85));
    opacity: 0;
    pointer-events: none;
    transition: opacity .7s ease;
    will-change: opacity;
    z-index: 10;
  }
  body.is-open .backdrop { opacity: 1; pointer-events: auto; }

  .stage {
    position: fixed;
    z-index: 20;
    perspective: 2000px;
    pointer-events: none;
  }
  .card {
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
    pointer-events: auto;
    will-change: transform;
  }
  .flipper {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 3%;
  }
  .face.front {
    background: linear-gradient(145deg, var(--tile1), var(--tile2));
    box-shadow: inset 0 0 0 clamp(10px, 2.8vmin, 30px) var(--edge);
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 800;
    container-type: size;
  }
  .face.front span { font-size: 36cqw; text-shadow: 0 .06em 0 rgba(0,0,0,.35); }

  .face.back {
    transform: rotateY(180deg);
    background: linear-gradient(145deg, var(--tile1), var(--tile2));
    padding: 2.2%;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .frame {
    width: 100%;
    height: 100%;
    border-radius: 2.2%;
    border: clamp(6px, 1.2vmin, 14px) solid var(--accent);
    overflow: hidden;
    position: relative;
    background: #0d1f4d;
    box-shadow: 0 0 40px rgba(182,242,58,.5);
  }
  .frame .blur {
    position: absolute;
    inset: -10%;
    background: center / cover no-repeat;
    filter: blur(30px) brightness(.6);
  }
  .frame img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .frame .placeholder {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    color: rgba(255,255,255,.85);
    font-size: clamp(20px, 4vmin, 48px);
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 20px, transparent 20px 40px),
      linear-gradient(135deg, #ff6aa2, #7a5cff 50%, #2fd3ff);
  }
  .frame .placeholder b { display: block; font-size: 3em; line-height: 1; }

  .shine {
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
    transform: translateX(-120%);
    pointer-events: none;
  }
  .stage.revealed .shine { animation: shine 1.1s .1s ease-out forwards; }
  @keyframes shine { to { transform: translateX(120%); } }

  /* ---------- Крестик ---------- */
  .close {
    position: absolute;
    top: 0;
    right: 0;
    width: clamp(52px, 8vmin, 84px);
    height: clamp(52px, 8vmin, 84px);
    transform: translate(40%, -40%) scale(0) rotate(-180deg);
    border-radius: 50%;
    border: 4px solid #fff;
    background: linear-gradient(145deg, #ff5f6d, #e0245e);
    box-shadow: 0 6px 0 #9c1240, 0 10px 25px rgba(0,0,0,.4);
    cursor: pointer;
    pointer-events: auto;
    transition: transform .7s cubic-bezier(.34,1.4,.64,1);
    z-index: 2;
  }
  .stage.revealed .close { transform: translate(40%, -40%) scale(1) rotate(0); }
  .close:hover { transform: translate(40%, -40%) scale(1.12) rotate(90deg) !important; }
  .close:active { transform: translate(40%, -36%) scale(.95) !important; box-shadow: 0 2px 0 #9c1240; }
  .close::before, .close::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 50%;
    height: 12%;
    background: #fff;
    border-radius: 99px;
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .close::after { transform: translate(-50%, -50%) rotate(-45deg); }

  /* ---------- Искры ---------- */
  .spark {
    position: fixed;
    z-index: 15;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    pointer-events: none;
  }

  /* ---------- Кнопка сброса ---------- */
  .reset {
    position: fixed;
    left: 12px;
    bottom: 12px;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,.6);
    background: rgba(18,53,138,.6);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    opacity: .35;
    transition: opacity .2s;
    z-index: 5;
  }
  .reset:hover { opacity: 1; }
</style>
</head>
<body>

<main class="grid" id="grid"></main>
<div class="backdrop"></div>
<button class="reset" id="reset" title="Закрыть все окошки заново">↺</button>

<script>
  const TOTAL = 30;
  // Картинки кладутся в папку images/ с именами 1.jpg, 2.png, 3.gif ... 30.webp
  const EXTENSIONS = ["jpg", "jpeg", "png", "webp", "gif"];

  const grid = document.getElementById("grid");
  const imageCache = {};      // номер -> найденный путь (или null)
  const opened = new Set();
  let current = null;         // { tile, stage, n }
  let busy = false;

  // ---------- Поиск картинки ----------
  function findImage(n) {
    if (n in imageCache) return Promise.resolve(imageCache[n]);
    return new Promise(resolve => {
      let idx = 0;
      const tryNext = () => {
        if (idx >= EXTENSIONS.length) { imageCache[n] = null; return resolve(null); }
        const src = `images/${n}.${EXTENSIONS[idx++]}`;
        const img = new Image();
        img.onload = () => { imageCache[n] = src; resolve(src); };
        img.onerror = tryNext;
        img.src = src;
      };
      tryNext();
    });
  }

  // ---------- Сетка ----------
  for (let n = 1; n <= TOTAL; n++) {
    const tile = document.createElement("button");
    tile.className = "tile";
    tile.style.setProperty("--i", n);
    tile.dataset.n = n;
    tile.innerHTML = `<div class="thumb"></div><span class="num">${n}</span>`;
    tile.addEventListener("click", () => openTile(tile));
    grid.appendChild(tile);
    findImage(n); // предзагрузка
  }

  // ---------- Открытие ----------
  async function openTile(tile) {
    if (busy || current) return;
    busy = true;
    const n = +tile.dataset.n;
    const src = await findImage(n);

    const from = tile.getBoundingClientRect();
    const size = Math.min(innerWidth * 0.82, innerHeight * 0.82);
    const to = {
      left: (innerWidth - size) / 2,
      top: (innerHeight - size) / 2,
      size
    };

    const stage = document.createElement("div");
    stage.className = "stage";
    Object.assign(stage.style, {
      left: to.left + "px", top: to.top + "px",
      width: size + "px", height: size + "px"
    });

    const content = src
      ? `<div class="blur" style="background-image:url('${src}')"></div><img src="${src}" alt="">`
      : `<div class="placeholder"><div><b>${n}</b>Здесь будет картинка</div></div>`;

    stage.innerHTML = `
      <div class="card">
        <div class="flipper">
          <div class="face front"><span>${n}</span></div>
          <div class="face back">
            <div class="frame">${content}<div class="shine"></div></div>
          </div>
        </div>
        <button class="close" aria-label="Закрыть"></button>
      </div>`;
    document.body.appendChild(stage);

    const card = stage.querySelector(".card");
    const flipper = stage.querySelector(".flipper");
    stage.querySelector(".close").addEventListener("click", closeTile);

    const scale = from.width / size;
    const dx = from.left - to.left;
    const dy = from.top - to.top;

    tile.classList.add("hidden");
    document.body.classList.add("is-open");
    burst(from.left + from.width / 2, from.top + from.height / 2);

    const dur = 1000;
    card.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(${scale})` },
      { transform: "translate(0,0) scale(1)" }
    ], { duration: dur, easing: "cubic-bezier(.65,0,.35,1)", fill: "both" });

    await flipper.animate([
      { transform: "rotateY(0deg)" },
      { transform: "rotateY(180deg)" }
    ], { duration: dur, easing: "cubic-bezier(.65,0,.35,1)", fill: "both" }).finished;

    stage.classList.add("revealed");
    current = { tile, stage, n, src };
    busy = false;
  }

  // ---------- Закрытие ----------
  async function closeTile() {
    if (busy || !current) return;
    busy = true;
    const { tile, stage, n, src } = current;
    stage.classList.remove("revealed");

    const from = tile.getBoundingClientRect();
    const to = stage.getBoundingClientRect();
    const scale = from.width / to.width;
    const dx = from.left - to.left;
    const dy = from.top - to.top;

    document.body.classList.remove("is-open");

    const dur = 800;
    const card = stage.querySelector(".card");
    const flipper = stage.querySelector(".flipper");
    card.animate([
      { transform: "translate(0,0) scale(1)" },
      { transform: `translate(${dx}px, ${dy}px) scale(${scale})` }
    ], { duration: dur, easing: "cubic-bezier(.65,0,.35,1)", fill: "both" });
    await flipper.animate([
      { transform: "rotateY(180deg)" },
      { transform: "rotateY(360deg)" }
    ], { duration: dur, easing: "cubic-bezier(.65,0,.35,1)", fill: "both" }).finished;

    // Помечаем окошко как открытое (показываем картинку в нём)
    opened.add(n);
    tile.classList.add("opened");
    if (src) tile.querySelector(".thumb").style.backgroundImage = `url('${src}')`;
    tile.classList.remove("hidden");
    stage.remove();
    current = null;
    busy = false;
  }

  // ---------- Искры ----------
  function burst(x, y) {
    const colors = ["#b6f23a", "#ffffff", "#ffd23f", "#ff6aa2", "#5fe0ff"];
    for (let i = 0; i < 22; i++) {
      const s = document.createElement("div");
      s.className = "spark";
      s.style.left = x - 7 + "px";
      s.style.top = y - 7 + "px";
      s.style.background = colors[i % colors.length];
      document.body.appendChild(s);
      const a = Math.random() * Math.PI * 2;
      const d = 80 + Math.random() * 180;
      s.animate([
        { transform: "translate(0,0) scale(1)", opacity: 1 },
        { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(0)`, opacity: 0 }
      ], { duration: 700 + Math.random() * 400, easing: "cubic-bezier(.1,.8,.3,1)" })
        .finished.then(() => s.remove());
    }
  }

  // ---------- Клавиши и сброс ----------
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeTile(); });

  document.getElementById("reset").addEventListener("click", () => {
    if (current) return;
    if (!confirm("Закрыть все окошки заново?")) return;
    opened.clear();
    document.querySelectorAll(".tile").forEach(t => {
      t.classList.remove("opened");
      t.querySelector(".thumb").style.backgroundImage = "";
    });
  });
</script>
</body>
</html>
